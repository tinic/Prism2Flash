name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  format:
    name: LLVM formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m venv build-format-env
      - run: build-format-env/bin/python -m pip install clang-format==18.1.8
      - run: CLANG_FORMAT=build-format-env/bin/clang-format tools/ci.sh format-check
  host:
    name: Host (${{ matrix.os }}, ${{ matrix.cxx }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, cxx: g++}
          - {os: ubuntu-24.04, cxx: clang++}
          - {os: macos-15, cxx: clang++}
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install independent LHA reader (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lhasa
      - name: Install independent LHA reader (macOS)
        if: runner.os == 'macOS'
        run: brew install lhasa
      - run: tools/ci.sh host
      - name: Address and undefined-behavior sanitizers
        if: runner.os == 'Linux' && matrix.cxx == 'clang++'
        run: tools/ci.sh sanitize
  native:
    name: Amiga 68000 and release package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache pinned compiler
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ai/toolchain-cache/prism2flash
          key: amiga-linux-${{ hashFiles('tools/toolchain.json', 'tools/*toolchain*.py') }}
      - name: Install independent LHA reader
        run: sudo apt-get update && sudo apt-get install -y lhasa
      - run: python3 tools/check_project.py
      - run: tools/ci.sh native
      - run: tools/ci.sh package
      - name: Upload downloadable native and source packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism2flash-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Download the uploaded release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prism2flash-release
          path: build-artifact-check
      - name: Verify downloaded packages and corresponding source
        run: python3 tools/verify_release.py build-artifact-check
